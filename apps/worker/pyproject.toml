[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sana-worker"
version = "0.1.0"
description = "Worker periodico de evaluacion de alertas para sana-airlytics"
requires-python = ">=3.14"
dependencies = [
    "sqlalchemy>=2.0.48",
    "asyncpg>=0.31.0",
    "python-dotenv>=1.0.0",
    "resend>=2.29.0",
    "structlog>=25.5.0",
]
