[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sana-airlytics"
version = "0.1.0"
description = "Air quality analytics for Sensirion SEN66"
requires-python = ">=3.14"
dependencies = [
    "aiomqtt>=2.5.1",
    "alembic>=1.18.4",
    "aiosmtplib>=3.0",
    "asyncpg>=0.31.0",
    "bcrypt>=4.0",
    "email-validator>=2.0",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "pydantic-settings>=2.0",
    "python-jose[cryptography]>=3.3",
    "pyyaml>=6.0.3",
    "sentry-sdk>=2.57.0",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.48",
    "structlog>=25.5.0",
    "psycopg2-binary>=2.9.12",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "psycopg[binary]>=3.3.3",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "python-dotenv>=1.2.2",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["src"]
