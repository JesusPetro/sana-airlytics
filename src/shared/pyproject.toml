[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sana-shared"
version = "0.3.0"
description = "Shared domain and infrastructure for sana-airlytics"
requires-python = ">=3.14"
dependencies = [
    "sqlalchemy>=2.0.48",
    "structlog>=25.5.0",
    "sentry-sdk>=2.57.0",
]

[project.optional-dependencies]
orm = [
    "asyncpg>=0.31.0",
    "psycopg2-binary>=2.9.12",
]
auth = [
    "bcrypt>=4.0",
    "python-jose[cryptography]>=3.3",
]
email = [
    "aiosmtplib>=3.0",
    "jinja2>=3.1",
    "resend>=2.29.0",
]
mqtt = [
    "aiomqtt>=2.5.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*"]
